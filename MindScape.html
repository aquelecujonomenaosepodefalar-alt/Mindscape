<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>MindScape</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;overflow:hidden;}
:root{
  --bg:#0f0e0b;--bg2:#181610;--bg3:#211e16;
  --gold:#c8973a;--gold2:#e8b84b;
  --cream:#f0e6d0;--cream2:#b8a98a;--muted:#5a5243;
  --border:rgba(200,151,58,0.18);--border2:rgba(200,151,58,0.35);
  --radius:12px;
}
body{background:var(--bg);color:var(--cream);font-family:'Jost',sans-serif;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
input:focus{outline:none;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

const ADS=[
  {text:"BetterHelp — Professional therapy, online. First month free.",cta:"Try Free"},
  {text:"Headspace — Guided meditation for a calmer mind. 14-day trial.",cta:"Learn More"},
  {text:"Audible — Millions of audiobooks. First month on us.",cta:"Start Now"},
  {text:"Calm — Sleep stories, breathing & mindfulness.",cta:"Get Calm"},
];

const MORNING=[
  {id:"m1",icon:"✦",time:"5 min",title:"Shadow Journaling",who:"Carl Jung",desc:"Write one thing that unsettled you recently. Jung believed our 'shadow' — the suppressed parts of ourselves — holds the key to wholeness. Ask: what does this reaction reveal about me?"},
  {id:"m2",icon:"◎",time:"4 min",title:"4-7-8 Breathwork",who:"Andrew Weil / CBT",desc:"Inhale 4 counts. Hold 7. Exhale slowly 8. Repeat 4 cycles. This activates the parasympathetic nervous system, reducing cortisol before your day begins."},
  {id:"m3",icon:"◇",time:"3 min",title:"Intention Setting",who:"Viktor Frankl",desc:"Write: 'Today I will contribute meaning by…' Frankl taught that purpose — even in small acts — is the foundation of mental health. Anchor your day in meaning, not just tasks."},
  {id:"m4",icon:"○",time:"3 min",title:"Embodiment Check",who:"Wilhelm Reich",desc:"Stand, feel your feet on the ground. Notice where tension lives in your body. Three slow head rolls. Unclench your jaw. Reich was first to map how emotions are held physically."},
];

const EVENING=[
  {id:"e1",icon:"✦",time:"5 min",title:"Meaning Review",who:"Viktor Frankl",desc:"What gave your day meaning? Even in suffering, Frankl found purpose. Write 1–3 moments that felt significant — however small. The act of noticing transforms experience."},
  {id:"e2",icon:"◎",time:"5 min",title:"Gratitude Anchoring",who:"Martin Seligman",desc:"Write three specific things you're grateful for. Seligman's research shows this practice, done consistently, increases wellbeing scores within 3 weeks. Be specific, not generic."},
  {id:"e3",icon:"◇",time:"4 min",title:"Thought Record",who:"Aaron Beck / CBT",desc:"What automatic thought held you back today? Write: Event → Thought → Feeling. Then reframe one thought. Beck's cognitive therapy starts exactly here, with what we tell ourselves."},
  {id:"e4",icon:"○",time:"6 min",title:"Progressive Relaxation",who:"Edmund Jacobson",desc:"From toes upward, tense each muscle group 5 seconds then release. Jacobson's 1929 method remains the gold standard for somatic anxiety relief before sleep."},
];

const BOOKS=[
  {id:1,author:"Carl Jung",title:"Psychology of the Unconscious",year:1912,dur:"8h 42m",ok:true,desc:"Jung's breakthrough work exploring archetypes and symbols of the collective unconscious."},
  {id:2,author:"Carl Jung",title:"Psychological Types",year:1921,dur:"12h 15m",ok:true,desc:"The foundational text on introversion, extraversion, and the four psychological functions."},
  {id:3,author:"Sigmund Freud",title:"The Interpretation of Dreams",year:1899,dur:"10h 33m",ok:true,desc:"Freud's masterwork — dreams as the royal road to the unconscious and wish fulfillment."},
  {id:4,author:"Sigmund Freud",title:"Psychopathology of Everyday Life",year:1901,dur:"6h 20m",ok:true,desc:"How slips of the tongue, forgetting, and errors reveal hidden unconscious conflicts."},
  {id:5,author:"Sigmund Freud",title:"Three Essays on Sexuality",year:1905,dur:"4h 10m",ok:true,desc:"Freud's foundational text on the development of human sexuality and libidinal stages."},
  {id:6,author:"B.F. Skinner",title:"The Behavior of Organisms",year:1938,dur:"9h 45m",ok:false,desc:"The landmark study of operant conditioning that defined behavioral psychology."},
  {id:7,author:"Viktor Frankl",title:"Man's Search for Meaning",year:1946,dur:"5h 02m",ok:false,desc:"A survivor's account of Auschwitz and the birth of logotherapy — the search for purpose."},
  {id:8,author:"Jacques Lacan",title:"Écrits: Selected Works",year:1966,dur:"14h 30m",ok:false,desc:"Lacan's dense writings on language, desire, and the structure of the unconscious."},
];

const THERAPISTS={
  jung:{
    name:"Carl Jung",years:"1875 – 1961",role:"Founder of Analytical Psychology",
    intro:"Welcome, seeker. You have come to explore the depths. Tell me — what brought you here today? Perhaps a dream, a symbol that keeps returning, or a shadow you cannot shake?",
    system:"You are Carl Gustav Jung, the Swiss psychiatrist and founder of analytical psychology. Speak as Jung would — wise, thoughtful, philosophical, occasionally mystical. Draw naturally on your concepts: the collective unconscious, archetypes (Shadow, Anima/Animus, Self, Persona), individuation, synchronicity, active imagination. Ask probing questions about dreams, symbols, fantasies, and inner conflicts. Be warm but profound. Respond in 2–4 paragraphs. Speak in first person as Jung himself.",
  },
  freud:{
    name:"Sigmund Freud",years:"1856 – 1939",role:"Founder of Psychoanalysis",
    intro:"Ah. You have come. Good — most people resist this moment far longer than they should. Tell me, what brings you to the couch today? Begin wherever you like. There are no accidents.",
    system:"You are Sigmund Freud, the Austrian neurologist and founder of psychoanalysis. Speak as Freud would — precise, intellectually confident, probing, slightly formal. Draw naturally on your concepts: the unconscious, repression, id/ego/superego, defense mechanisms, Oedipus complex, libido, transference, dream analysis, free association. Ask about childhood experiences, relationships, dreams, recurring patterns. Be warm but analytical. Respond in 2–4 paragraphs. Speak in first person as Freud himself.",
  },
};

// ─── AD BANNER ───────────────────────────────────────────────────────────────
function AdBanner(){
  const[i,setI]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setI(x=>(x+1)%ADS.length),10000);return()=>clearInterval(t);},[]);
  const ad=ADS[i];
  return(
    <div style={{background:"var(--bg2)",borderBottom:"1px solid var(--border)",padding:"6px 14px",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
      <span style={{fontSize:9,letterSpacing:2,color:"var(--muted)",border:"1px solid var(--muted)",padding:"2px 5px",borderRadius:3}}>AD</span>
      <span style={{fontSize:12,color:"var(--cream2)",flex:1}}>{ad.text}</span>
      <span style={{fontSize:11,color:"var(--gold)",border:"1px solid var(--border2)",padding:"3px 10px",borderRadius:20,cursor:"pointer",whiteSpace:"nowrap"}}>{ad.cta}</span>
    </div>
  );
}

// ─── RITUALS ─────────────────────────────────────────────────────────────────
function RitualsScreen({checks,toggle}){
  const[mode,setMode]=useState("morning");
  const list=mode==="morning"?MORNING:EVENING;
  const done=list.filter(r=>checks[r.id]).length;
  const pct=Math.round(done/list.length*100);
  return(
    <div style={{padding:"22px 18px 80px",overflowY:"auto",height:"100%"}}>
      <div style={{marginBottom:18}}>
        <div style={{fontSize:10,letterSpacing:2,color:"var(--gold)",textTransform:"uppercase",marginBottom:4}}>Daily Practice</div>
        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:28,fontWeight:300}}>Your Rituals</div>
        <p style={{fontSize:13,color:"var(--cream2)",marginTop:5,lineHeight:1.6}}>Curated by the great minds of psychology. Practiced daily, these rituals compound.</p>
      </div>
      <div style={{display:"flex",background:"var(--bg2)",borderRadius:30,padding:3,border:"1px solid var(--border)",marginBottom:20,width:"fit-content"}}>
        {["morning","evening"].map(m=>(
          <button key={m} onClick={()=>setMode(m)} style={{padding:"7px 18px",borderRadius:27,border:"none",cursor:"pointer",background:mode===m?"var(--gold)":"transparent",color:mode===m?"var(--bg)":"var(--muted)",fontFamily:"'Jost',sans-serif",fontSize:11,letterSpacing:"1.5px",textTransform:"uppercase",fontWeight:mode===m?500:400,transition:"all .2s"}}>
            {m==="morning"?"☀ Morning":"☽ Evening"}
          </button>
        ))}
      </div>
      <div style={{marginBottom:18}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:7}}>
          <span style={{fontSize:12,color:"var(--cream2)"}}>{done}/{list.length} completed</span>
          <span style={{fontSize:12,color:"var(--gold)"}}>{pct}%</span>
        </div>
        <div style={{height:3,background:"var(--bg3)",borderRadius:3}}>
          <div style={{height:"100%",width:pct+"%",background:"var(--gold)",borderRadius:3,transition:"width .4s"}}/>
        </div>
      </div>
      <div style={{padding:"12px 16px",background:"rgba(200,151,58,0.06)",border:"1px solid var(--border)",borderRadius:10,marginBottom:18}}>
        <p style={{fontSize:15,fontStyle:"italic",fontFamily:"'Cormorant Garamond',serif",color:"var(--cream2)",lineHeight:1.6}}>
          {mode==="morning"
            ?'"Until you make the unconscious conscious, it will direct your life and you will call it fate." — Carl Jung'
            :'"Between stimulus and response there is a space. In that space is our power to choose." — Viktor Frankl'}
        </p>
      </div>
      {list.map(r=>(
        <div key={r.id} onClick={()=>toggle(r.id)} style={{background:checks[r.id]?"rgba(200,151,58,0.07)":"var(--bg2)",border:`1px solid ${checks[r.id]?"var(--border2)":"var(--border)"}`,borderRadius:"var(--radius)",padding:"14px 16px",cursor:"pointer",display:"flex",gap:14,alignItems:"flex-start",marginBottom:10,transition:"all .25s"}}>
          <div style={{width:26,height:26,borderRadius:"50%",flexShrink:0,marginTop:2,border:`1.5px solid ${checks[r.id]?"var(--gold)":"var(--muted)"}`,background:checks[r.id]?"var(--gold)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--bg)",fontSize:13,fontWeight:600,transition:"all .25s"}}>
            {checks[r.id]?"✓":""}
          </div>
          <div style={{flex:1}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
              <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,fontWeight:500,color:checks[r.id]?"var(--gold)":"var(--cream)"}}>{r.icon} {r.title}</span>
              <span style={{fontSize:10,color:"var(--muted)",letterSpacing:1}}>{r.time}</span>
            </div>
            <div style={{fontSize:10,letterSpacing:"1.5px",textTransform:"uppercase",color:"var(--gold)",opacity:.7,marginBottom:6}}>{r.who}</div>
            <p style={{fontSize:13,color:"var(--cream2)",lineHeight:1.6,opacity:checks[r.id]?.6:1}}>{r.desc}</p>
          </div>
        </div>
      ))}
      {done===list.length&&(
        <div style={{textAlign:"center",padding:20}}>
          <div style={{fontSize:28,marginBottom:8}}>✦</div>
          <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,color:"var(--gold)"}}>
            {mode==="morning"?"Ritual complete. Your day begins with intention.":"Ritual complete. Rest well, with meaning."}
          </p>
        </div>
      )}
    </div>
  );
}

// ─── LIBRARY ──────────────────────────────────────────────────────────────────
function LibraryScreen(){
  const[playing,setPlaying]=useState(null);
  const[progress,setProgress]=useState({});
  const[active,setActive]=useState(false);
  const timer=useRef(null);

  const play=(book)=>{
    if(playing&&playing.id===book.id){
      setActive(a=>{
        if(a)clearInterval(timer.current);
        else timer.current=setInterval(()=>setProgress(p=>({...p,[book.id]:Math.min((p[book.id]||0)+0.06,100)})),500);
        return!a;
      });
    }else{
      clearInterval(timer.current);
      setPlaying(book);
      setActive(true);
      timer.current=setInterval(()=>setProgress(p=>({...p,[book.id]:Math.min((p[book.id]||0)+0.06,100)})),500);
    }
  };

  const fmtTime=(book,pct)=>{
    const parts=book.dur.split("h ");
    const total=parseInt(parts[0])*60+parseInt(parts[1]);
    const el=Math.round(total*(pct/100));
    return`${Math.floor(el/60)}h ${el%60}m`;
  };

  return(
    <div style={{height:"100%",overflowY:"auto",display:"flex",flexDirection:"column"}}>
      <div style={{padding:"22px 18px 14px",flexShrink:0}}>
        <div style={{fontSize:10,letterSpacing:2,color:"var(--gold)",textTransform:"uppercase",marginBottom:4}}>Public Domain</div>
        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:28,fontWeight:300}}>Audiobook Library</div>
        <p style={{fontSize:13,color:"var(--cream2)",marginTop:5,lineHeight:1.6}}>The collected works of the great minds. Listen, absorb, transform.</p>
      </div>

      {playing&&(
        <div style={{margin:"0 18px 14px",background:"var(--bg2)",border:"1px solid var(--border2)",borderRadius:"var(--radius)",padding:"14px 16px",flexShrink:0}}>
          <div style={{fontSize:10,letterSpacing:2,color:"var(--gold)",textTransform:"uppercase",marginBottom:2}}>{playing.author}</div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,marginBottom:10}}>{playing.title}</div>
          <div style={{height:3,background:"var(--bg3)",borderRadius:3,marginBottom:6}}>
            <div style={{height:"100%",width:(progress[playing.id]||0)+"%",background:"var(--gold)",borderRadius:3,transition:"width .5s linear"}}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}>
            <span style={{fontSize:11,color:"var(--muted)"}}>{fmtTime(playing,progress[playing.id]||0)}</span>
            <span style={{fontSize:11,color:"var(--muted)"}}>{playing.dur}</span>
          </div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:24}}>
            <button onClick={()=>setProgress(p=>({...p,[playing.id]:Math.max((p[playing.id]||0)-3,0)}))} style={{background:"none",border:"none",color:"var(--cream2)",fontSize:18,cursor:"pointer"}}>⟪</button>
            <button onClick={()=>play(playing)} style={{width:48,height:48,borderRadius:"50%",background:"var(--gold)",border:"none",fontSize:18,cursor:"pointer",color:"var(--bg)"}}>
              {active?"⏸":"▶"}
            </button>
            <button onClick={()=>setProgress(p=>({...p,[playing.id]:Math.min((p[playing.id]||0)+3,100)}))} style={{background:"none",border:"none",color:"var(--cream2)",fontSize:18,cursor:"pointer"}}>⟫</button>
          </div>
        </div>
      )}

      <div style={{padding:"0 18px 80px",overflowY:"auto",flex:1}}>
        {BOOKS.map(book=>(
          <div key={book.id} style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"14px",marginBottom:10,display:"flex",gap:12,alignItems:"center"}}>
            <div style={{width:46,height:62,borderRadius:5,flexShrink:0,background:book.ok?"rgba(200,151,58,0.12)":"var(--bg3)",border:`1px solid ${book.ok?"var(--border2)":"var(--border)"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,color:"var(--gold)"}}>
              {book.ok?"◎":"◇"}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:10,color:"var(--gold)",letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:2}}>{book.author}</div>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:16,marginBottom:3,lineHeight:1.3}}>{book.title}</div>
              <p style={{fontSize:12,color:"var(--cream2)",lineHeight:1.5,marginBottom:8}}>{book.desc}</p>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:11,color:"var(--muted)"}}>{book.year} · {book.dur}</span>
                {book.ok
                  ?<button onClick={()=>play(book)} style={{padding:"4px 14px",borderRadius:20,background:"var(--gold)",border:"none",color:"var(--bg)",fontFamily:"'Jost',sans-serif",fontSize:11,cursor:"pointer",fontWeight:500}}>
                    {playing&&playing.id===book.id&&active?"⏸ Pause":"▶ Listen"}
                  </button>
                  :<span style={{fontSize:10,letterSpacing:1,color:"var(--muted)",border:"1px solid var(--border)",padding:"3px 10px",borderRadius:20}}>Coming Soon</span>
                }
              </div>
            </div>
          </div>
        ))}
        <div style={{padding:"12px 14px",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,fontSize:12,color:"var(--muted)",lineHeight:1.6}}>
          ℹ Available titles are in the public domain. Audiobooks sourced from LibriVox. Other titles pending rights clearance.
        </div>
      </div>
    </div>
  );
}

// ─── CHAT ────────────────────────────────────────────────────────────────────
function ChatScreen(){
  const[who,setWho]=useState(null);
  const[msgs,setMsgs]=useState([]);
  const[inp,setInp]=useState("");
  const[loading,setLoading]=useState(false);
  const bottom=useRef(null);

  useEffect(()=>{
    if(who&&msgs.length===0)setMsgs([{role:"assistant",content:THERAPISTS[who].intro}]);
  },[who]);

  useEffect(()=>{bottom.current?.scrollIntoView({behavior:"smooth"});},[msgs,loading]);

  const send=useCallback(async()=>{
    const text=inp.trim();
    if(!text||loading)return;
    setInp("");
    const next=[...msgs,{role:"user",content:text}];
    setMsgs(next);
    setLoading(true);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:THERAPISTS[who].system,messages:next})
      });
      const data=await res.json();
      const reply=data.content?.map(b=>b.text||"").join("")||"A moment of silence… please try again.";
      setMsgs(m=>[...m,{role:"assistant",content:reply}]);
    }catch{
      setMsgs(m=>[...m,{role:"assistant",content:"A moment of silence… please try again shortly."}]);
    }finally{setLoading(false);}
  },[inp,loading,msgs,who]);

  if(!who)return(
    <div style={{padding:"22px 18px",overflowY:"auto",height:"100%"}}>
      <div style={{marginBottom:24}}>
        <div style={{fontSize:10,letterSpacing:2,color:"var(--gold)",textTransform:"uppercase",marginBottom:4}}>AI Sessions</div>
        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:28,fontWeight:300}}>Speak with the Masters</div>
        <p style={{fontSize:13,color:"var(--cream2)",marginTop:5,lineHeight:1.6}}>Choose your analyst. The AI embodies their actual theories, language and method. For self-reflection — not clinical advice.</p>
      </div>
      {Object.entries(THERAPISTS).map(([key,t])=>(
        <div key={key} onClick={()=>setWho(key)} style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"20px",marginBottom:14,cursor:"pointer",position:"relative",overflow:"hidden"}}
          onMouseEnter={e=>e.currentTarget.style.borderColor="var(--border2)"}
          onMouseLeave={e=>e.currentTarget.style.borderColor="var(--border)"}>
          <div style={{position:"absolute",right:14,top:10,fontSize:52,opacity:.05,fontFamily:"'Cormorant Garamond',serif"}}>Ψ</div>
          <div style={{fontSize:10,letterSpacing:2,color:"var(--gold)",textTransform:"uppercase",marginBottom:3}}>{t.years}</div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:24,marginBottom:2}}>{t.name}</div>
          <div style={{fontSize:11,color:"var(--cream2)",marginBottom:12}}>{t.role}</div>
          <p style={{fontSize:15,fontStyle:"italic",fontFamily:"'Cormorant Garamond',serif",color:"var(--cream2)",marginBottom:14,lineHeight:1.6}}>"{t.intro.slice(0,100)}…"</p>
          <span style={{fontSize:11,color:"var(--gold)",letterSpacing:1}}>Begin Session →</span>
        </div>
      ))}
      <div style={{padding:"12px 14px",background:"rgba(192,57,43,0.08)",border:"1px solid rgba(192,57,43,0.2)",borderRadius:10,fontSize:11,color:"rgba(240,230,208,0.6)",lineHeight:1.6}}>
        ⚠ These AI conversations are for educational and self-reflective purposes only. They do not constitute clinical therapy or medical advice.
      </div>
    </div>
  );

  const t=THERAPISTS[who];
  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      <div style={{padding:"12px 16px",background:"var(--bg2)",borderBottom:"1px solid var(--border)",flexShrink:0,display:"flex",alignItems:"center",gap:12}}>
        <button onClick={()=>{setWho(null);setMsgs([]);}} style={{background:"none",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:20,lineHeight:1}}>←</button>
        <div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17}}>{t.name}</div>
          <div style={{fontSize:10,color:"var(--gold)",letterSpacing:1}}>{t.role}</div>
        </div>
        <div style={{marginLeft:"auto",width:8,height:8,borderRadius:"50%",background:"#2ecc71",boxShadow:"0 0 6px #2ecc71"}}/>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"16px",display:"flex",flexDirection:"column",gap:14}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
            <div style={{maxWidth:"82%",padding:"12px 16px",borderRadius:16,background:m.role==="user"?"rgba(200,151,58,0.15)":"var(--bg2)",border:`1px solid ${m.role==="user"?"var(--border2)":"var(--border)"}`,borderBottomRightRadius:m.role==="user"?4:16,borderBottomLeftRadius:m.role==="assistant"?4:16}}>
              {m.role==="assistant"&&<div style={{fontSize:9,letterSpacing:2,color:"var(--gold)",textTransform:"uppercase",marginBottom:6}}>{t.name}</div>}
              <p style={{fontSize:m.role==="assistant"?16:14,color:"var(--cream)",lineHeight:1.7,fontFamily:m.role==="assistant"?"'Cormorant Garamond',serif":"'Jost',sans-serif",fontWeight:300}}>{m.content}</p>
            </div>
          </div>
        ))}
        {loading&&(
          <div style={{display:"flex"}}>
            <div style={{padding:"12px 20px",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"16px 16px 16px 4px"}}>
              <span style={{color:"var(--muted)",fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:15}}>Reflecting…</span>
            </div>
          </div>
        )}
        <div ref={bottom}/>
      </div>
      <div style={{padding:"12px 16px",background:"var(--bg2)",borderTop:"1px solid var(--border)",flexShrink:0,display:"flex",gap:10}}>
        <input value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()}
          placeholder={`Speak freely with ${t.name.split(" ")[1]}…`}
          style={{flex:1,background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:24,padding:"11px 18px",color:"var(--cream)",fontFamily:"'Jost',sans-serif",fontSize:14}}/>
        <button onClick={send} disabled={!inp.trim()||loading} style={{width:44,height:44,borderRadius:"50%",background:inp.trim()&&!loading?"var(--gold)":"var(--bg3)",border:"1px solid var(--border)",color:inp.trim()&&!loading?"var(--bg)":"var(--muted)",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s"}}>↑</button>
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const[tab,setTab]=useState("rituals");
  const[checks,setChecks]=useState({});
  const toggle=id=>setChecks(c=>({...c,[id]:!c[id]}));

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:"var(--bg)",color:"var(--cream)",fontFamily:"'Jost',sans-serif",overflow:"hidden"}}>
      <AdBanner/>
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {tab==="rituals"&&<div style={{flex:1,overflow:"hidden"}}><RitualsScreen checks={checks} toggle={toggle}/></div>}
        {tab==="library"&&<div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}><LibraryScreen/></div>}
        {tab==="chat"&&<div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}><ChatScreen/></div>}
      </div>
      <div style={{display:"flex",borderTop:"1px solid var(--border)",background:"var(--bg2)",flexShrink:0}}>
        {[{id:"rituals",label:"Rituals",icon:"◎"},{id:"library",label:"Library",icon:"◇"},{id:"chat",label:"Analysts",icon:"Ψ"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"10px 4px 8px",cursor:"pointer",border:"none",background:"none",color:tab===t.id?"var(--gold)":"var(--muted)",fontFamily:"'Jost',sans-serif",fontSize:9,letterSpacing:"1.5px",textTransform:"uppercase",transition:"color .2s"}}>
            <span style={{fontSize:18}}>{t.icon}</span>
            {t.label}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
