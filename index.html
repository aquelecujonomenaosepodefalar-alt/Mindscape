<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MindScape</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Jost&display=swap" rel="stylesheet"/>

<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body{margin:0;background:#0d0c09;color:#f0e6d0;font-family:'Jost',sans-serif;}
button{cursor:pointer}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const {useState, useEffect} = React;

function speak(text){
  if(!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  const voices = window.speechSynthesis.getVoices() || [];
  if(voices.length) u.voice = voices[0];
  window.speechSynthesis.speak(u);
}

function App(){

  const [step,setStep] = useState("start");
  const [dream,setDream] = useState("");
  const [response,setResponse] = useState("");

  function start(){
    speak("Inhale... hold... exhale...");
    setStep("dream");
  }

  function interpret(){
    setResponse("This is a simulated response from Freud. Your unconscious is speaking in symbols.");
    setStep("done");
  }

  return(
    <div style={{padding:20}}>

      <h1>MindScape</h1>

      {step==="start" && (
        <div>
          <p>Start your morning ritual.</p>
          <button onClick={start}>Begin</button>
        </div>
      )}

      {step==="dream" && (
        <div>
          <p>Describe your dream:</p>
          <textarea 
            value={dream}
            onChange={e=>setDream(e.target.value)}
            rows={3}
            style={{width:"100%"}}
          />
          <button onClick={interpret}>Interpret</button>
        </div>
      )}

      {step==="done" && (
        <div>
          <p>{response}</p>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
