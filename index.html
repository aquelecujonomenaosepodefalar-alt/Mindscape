// ── AUDIO ENGINE ────────────────────────────────────────────────────────────
function makeAmbient(){
  let ctx=null,nodes=[],active=false;
  const start=()=>{
    if(active)return;
    try{
      ctx=new(window.AudioContext||window.webkitAudioContext)();
      const m=ctx.createGain();m.gain.value=0.055;m.connect(ctx.destination);
      [[174.6,0],[261.6,.5],[349.2,1],[523.2,1.6]].forEach(([f,d])=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.type='sine';o.frequency.value=f;g.gain.value=.5;
        o.connect(g);g.connect(m);o.start(ctx.currentTime+d);nodes.push(o);
      });active=true;
    }catch{}
  };
  const stop=()=>{
    if(!active)return;
    nodes.forEach(n=>{try{n.stop();n.disconnect();}catch{}});
    nodes=[];try{ctx?.close();}catch{}ctx=null;active=false;
  };
  return{start,stop,isActive:()=>active};
}

function speak(text,rate=0.88,pitch=0.92){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=rate;u.pitch=pitch;u.volume=0.9;
  const voices=speechSynthesis.getVoices();
  const en=voices.find(v=>v.lang.startsWith('en')&&v.name.toLowerCase().includes('male'))
    ||voices.find(v=>v.lang.startsWith('en'))||voices[0];
  if(en)u.voice=en;
  speechSynthesis.speak(u);
}

// ── MORNING RITUAL ───────────────────────────────────────────────────────────
function MorningRitual({onComplete}){
  const[step,setStep]=useState('intro'); // intro | dream | breathwork | done
  const[dream,setDream]=useState('');
  const[freudReply,setFreudReply]=useState('');
  const[loading,setLoading]=useState(false);
  const[breathPhase,setBreathPhase]=useState('inhale');
  const[breathCount,setBreathCount]=useState(0);
  const[beat,setBeat]=useState(0);
  const[soundOn,setSoundOn]=useState(true);
  const breathRef=useRef(null);
  const beatRef=useRef(null);
  const audioRef=useRef(null);

  useEffect(()=>{audioRef.current=makeAmbient();return()=>{audioRef.current.stop();clearInterval(breathRef.current);clearInterval(beatRef.current);window.speechSynthesis?.cancel();};},[]);

  const startBreath=()=>{
    setStep('breathwork');
    if(soundOn)audioRef.current.start();
    const seq=[
      {p:'inhale',t:4,cue:'Inhale slowly… one… two… three… four…'},
      {p:'hold',t:7,cue:'Hold… one… two… three… four… five… six… seven…'},
      {p:'exhale',t:8,cue:'Exhale… slowly… one… two… three… four… five… six… seven… eight…'},
    ];
    let cycle=0,si=0,tick=0;
    const run=()=>{
      const cur=seq[si];
      if(tick===0){setBreathPhase(cur.p);if(soundOn)speak(cur.cue,.75,.9);}
      tick++;
      if(tick>=cur.t){
        tick=0;si=(si+1)%seq.length;
        if(si===0){cycle++;setBreathCount(cycle);}
        if(cycle>=4){clearInterval(breathRef.current);clearInterval(beatRef.current);audioRef.current.stop();setStep('dream');}
      }
    };
    breathRef.current=setInterval(run,1000);
    beatRef.current=setInterval(()=>setBeat(b=>b+1),2000);
  };

  const submitDream=async()=>{
    if(!dream.trim())return;
    setLoading(true);setStep('freud');
    try{
      const reply=await callAI(FREUD_SYSTEM,`My dream last night: "${dream}"`);
      setFreudReply(reply||'The unconscious speaks in symbols we are not yet ready to hear. Return to this dream tonight.');
    }catch{setFreudReply('The connection to the unconscious was interrupted. Try again, or simply sit with the image your dream left behind.');}
    setLoading(false);
  };

  const finish=()=>{onComplete('morning');};

  const card=(children,extra={})=>(
    <div style={{background:C.bg2,border:`1px solid ${C.border2}`,borderRadius:'var(--radius)',padding:'20px',animation:'fadeUp .4s ease',...extra}}>
      {children}
    </div>
  );

  return(
    <div style={{height:'100%',overflowY:'auto',padding:'20px 18px 100px'}}>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:9,letterSpacing:3,color:C.gold,textTransform:'uppercase',marginBottom:4}}>Morning Ritual</div>
        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:26,fontWeight:300,color:C.cream}}>☀ Awakening Practice</div>
        <p style={{fontSize:13,color:C.cream2,marginTop:5,lineHeight:1.6}}>Begin with the breath. Then bring what the night left behind.</p>
      </div>

      {step==='intro'&&card(
        <div style={{textAlign:'center',padding:'10px 0'}}>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:42,color:C.gold,marginBottom:16,opacity:.5}}>◎</div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:20,color:C.cream,marginBottom:10}}>4 · 7 · 8 Breathwork</div>
          <p style={{fontSize:14,color:C.cream2,lineHeight:1.7,marginBottom:20,fontFamily:"'Cormorant Garamond',serif",fontStyle:'italic',fontSize:16}}>Four complete cycles. Inhale four, hold seven, exhale eight. This one practice activates the parasympathetic nervous system — the body's own off switch for stress.</p>
          <p style={{fontSize:12,color:C.muted,marginBottom:24}}>Audio guidance will lead each breath.</p>
          <button onClick={startBreath} style={{padding:'14px 44px',background:C.gold,border:'none',borderRadius:30,color:C.bg,fontFamily:"'Jost',sans-serif",fontSize:14,letterSpacing:1,cursor:'pointer',fontWeight:500}}>
            Begin Breathwork
          </button>
        </div>
      )}

      {step==='breathwork'&&card(
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <div style={{fontSize:11,color:C.muted}}>Cycle {breathCount+1} of 4</div>
            <button onClick={()=>{setSoundOn(s=>!s);if(soundOn)audioRef.current.stop();else audioRef.current.start();}} style={{fontSize:11,color:soundOn?C.gold:C.muted,background:'none',border:`1px solid ${C.border}`,padding:'3px 12px',borderRadius:20,cursor:'pointer'}}>
              ♪ {soundOn?'On':'Off'}
            </button>
          </div>
          <BreathCircle phase={breathPhase}/>
        </div>
      )}

      {step==='dream'&&card(
        <div>
          <div style={{fontSize:9,letterSpacing:3,color:C.gold,textTransform:'uppercase',marginBottom:4}}>Sigmund Freud</div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:20,color:C.cream,marginBottom:6}}>Dream Analysis</div>

// ── EVENING RITUAL ───────────────────────────────────────────────────────────
const SHADOW_QUESTIONS=[
  {key:'bothered',q:'What bothered or unsettled you today?',placeholder:'Something happened today that I couldn't shake…',cue:'Let it surface without judgment. What stayed with you?'},
  {key:'why',q:'Why do you think this happened?',placeholder:'I think it happened because…',cue:'Go beneath the surface. What patterns do you notice?'},
  {key:'says',q:'What does this say about you?',placeholder:'This reveals that I…',cue:'Jung called this the Shadow. What part of you is speaking?'},
  {key:'opportunity',q:'How could this be an opportunity?',placeholder:'I could use this to…',cue:'Every shadow contains a gift. What is yours?'},
];

function EveningRitual({onComplete}){
  const[step,setStep]=useState('intro'); // intro | shadow | jung | relax | done
  const[qIdx,setQIdx]=useState(0);
  const[answers,setAnswers]=useState({});
  const[loading,setLoading]=useState(false);
  const[jungReply,setJungReply]=useState('');
  const[beat,setBeat]=useState(0);
  const[soundOn,setSoundOn]=useState(true);
  const beatRef=useRef(null);
  const audioRef=useRef(null);

  useEffect(()=>{audioRef.current=makeAmbient();return()=>{audioRef.current.stop();clearInterval(beatRef.current);window.speechSynthesis?.cancel();};},[]);

  const startRelax=()=>{
    setStep('relax');
    if(soundOn)audioRef.current.start();
    speak('We begin progressive relaxation. Follow the body guide. Tense each area for five seconds, then fully release.',.82,.9);
    let b=0;
    beatRef.current=setInterval(()=>{
      b++;setBeat(b);
      const idx=Math.min(Math.floor(b/3),RELAX_PARTS.length-1);
      if(b%3===0&&b>0){speak(RELAX_PARTS[idx].cue,.82,.9);}
      if(b>=RELAX_PARTS.length*3+2){clearInterval(beatRef.current);audioRef.current.stop();speak('Beautiful. Your body is at rest. Sleep well.',.8,.88);setTimeout(()=>setStep('done'),3000);}
    },3500);
  };

  const nextQ=()=>{
    if(qIdx<SHADOW_QUESTIONS.length-1)setQIdx(q=>q+1);
    else submitShadow();
  };

  const submitShadow=async()=>{
    setLoading(true);setStep('jung');
    const prompt=SHADOW_QUESTIONS.map(q=>`${q.q}\n${answers[q.key]||'(no answer)'}`).join('\n\n');
    try{
      const reply=await callAI(JUNG_SYSTEM,prompt);
      setJungReply(reply||'The shadow you have named tonight is the beginning of integration. Sit with what arose. We will continue tomorrow.');
    }catch{setJungReply('The unconscious is rarely in a hurry. What you have named tonight is already beginning to transform. Return to these words tomorrow.');}
    setLoading(false);
  };

  const curQ=SHADOW_QUESTIONS[qIdx];

  return(
    <div style={{height:'100%',overflowY:'auto',padding:'20px 18px 100px'}}>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:9,letterSpacing:3,color:C.gold,textTransform:'uppercase',marginBottom:4}}>Evening Ritual</div>
        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:26,fontWeight:300,color:C.cream}}>☽ Night Practice</div>
        <p style={{fontSize:13,color:C.cream2,marginTop:5,lineHeight:1.6}}>Shadow work with Jung. Progressive relaxation with Jacobson.</p>
      </div>

      {step==='intro'&&(
        <div style={{background:C.bg2,border:`1px solid ${C.border2}`,borderRadius:'var(--radius)',padding:'20px',animation:'fadeUp .4s ease',textAlign:'center'}}>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:42,color:C.gold,opacity:.4,marginBottom:12}}>☽</div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:20,color:C.cream,marginBottom:10}}>Shadow Journal</div>
          <p style={{fontSize:16,fontStyle:'italic',fontFamily:"'Cormorant Garamond',serif",color:C.cream2,lineHeight:1.7,marginBottom:20}}>"Until you make the unconscious conscious, it will direct your life and you will call it fate."</p>
          <p style={{fontSize:12,color:C.muted,marginBottom:24}}>Four questions. Jung will read your answers and respond.</p>
          <button onClick={()=>setStep('shadow')} style={{padding:'14px 44px',background:C.gold,border:'none',borderRadius:30,color:C.bg,fontFamily:"'Jost',sans-serif",fontSize:14,letterSpacing:1,cursor:'pointer',fontWeight:500}}>
            Open the Shadow Journal
          </button>
        </div>
      )}

      {step==='shadow'&&(
        <div style={{background:C.bg2,border:`1px solid ${C.border2}`,borderRadius:'var(--radius)',padding:'20px',animation:'fadeIn .3s ease'}}>
          {/* Progress dots */}
          <div style={{display:'flex',gap:6,justifyContent:'center',marginBottom:20}}>
            {SHADOW_QUESTIONS.map((_,i)=>(
              <div key={i} style={{width:7,height:7,borderRadius:'50%',background:i===qIdx?C.gold:i<qIdx?C.muted:C.bg4,border:`1px solid ${i<=qIdx?C.gold:C.border}`,transition:'all .3s'}}/>
            ))}
          </div>
          <div style={{fontSize:9,letterSpacing:3,color:C.gold,textTransform:'uppercase',marginBottom:6}}>Question {qIdx+1} of {SHADOW_QUESTIONS.length}</div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:20,color:C.cream,marginBottom:6,lineHeight:1.4}}>{curQ.q}</div>
          <p style={{fontSize:13,color:C.muted,marginBottom:14,fontStyle:'italic'}}>{curQ.cue}</p>
          <textarea
            key={qIdx}
            value={answers[curQ.key]||''}
            onChange={e=>setAnswers(a=>({...a,[curQ.key]:e.target.value}))}
            placeholder={curQ.placeholder}
            rows={4}
            autoFocus
            style={{width:'100%',background:C.bg3,border:`1px solid ${C.border}`,borderRadius:10,padding:'12px 14px',color:C.cream,fontSize:16,lineHeight:1.8,fontFamily:"'Cormorant Garamond',serif",marginBottom:14}}
          />
          <div style={{display:'flex',gap:10}}>
            {qIdx>0&&<button onClick={()=>setQIdx(q=>q-1)} style={{padding:'10px 20px',background:'transparent',border:`1px solid ${C.border}`,borderRadius:24,color:C.muted,fontFamily:"'Jost',sans-serif",fontSize:12,cursor:'pointer'}}>← Back</button>}
            <button onClick={nextQ} disabled={!(answers[curQ.key]||'').trim()} style={{flex:1,padding:'10px',background:(answers[curQ.key]||'').trim()?C.gold:'transparent',border:`1px solid ${(answers[curQ.key]||'').trim()?C.gold:C.border}`,borderRadius:24,color:(answers[curQ.key]||'').trim()?C.bg:C.muted,fontFamily:"'Jost',sans-serif",fontSize:13,cursor:(answers[curQ.key]||'').trim()?'pointer':'default',fontWeight:500}}>
              {qIdx<SHADOW_QUESTIONS.length-1?'Next Question →':'Send to Jung →'}
            </button>
          </div>
        </div>
      )}

      {step==='jung'&&(
        <div style={{background:C.bg2,border:`1px solid ${C.border2}`,borderRadius:'var(--radius)',padding:'20px',animation:'fadeIn .3s ease'}}>
          <div style={{fontSize:9,letterSpacing:3,color:C.gold,textTransform:'uppercase',marginBottom:4}}>Jung's Response</div>
          {loading?(
            <div style={{textAlign:'center',padding:'30px 0'}}>
              <div style={{fontSize:32,color:C.gold,marginBottom:12,animation:'shimmer 1.5s ease-in-out infinite'}}>☽</div>
              <p style={{fontSize:16,fontStyle:'italic',fontFamily:"'Cormorant Garamond',serif",color:C.muted}}>Jung is reading your shadow…</p>
            </div>
          ):(
            <div>
              <p style={{fontSize:16,color:C.cream,lineHeight:1.85,fontFamily:"'Cormorant Garamond',serif",marginBottom:20,whiteSpace:'pre-wrap'}}>{jungReply}</p>
              <button onClick={startRelax} style={{width:'100%',padding:'12px',background:C.gold,border:'none',borderRadius:24,color:C.bg,fontFamily:"'Jost',sans-serif",fontSize:13,cursor:'pointer',fontWeight:500}}>
                Continue to Body Relaxation →
              </button>
            </div>
          )}
        </div>
      )}

      {step==='relax'&&(
        <div style={{background:C.bg2,border:`1px solid ${C.border2}`,borderRadius:'var(--radius)',padding:'20px',animation:'fadeIn .3s ease'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <div>
              <div style={{fontSize:9,letterSpacing:3,color:C.gold,textTransform:'uppercase',marginBottom:2}}>Edmund Jacobson</div>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,color:C.cream}}>Progressive Relaxation</div>
            </div>
            <button onClick={()=>{setSoundOn(s=>!s);if(soundOn)audioRef.current.stop();else audioRef.current.start();}} style={{fontSize:11,color:soundOn?C.gold:C.muted,background:'none',border:`1px solid ${C.border}`,padding:'3px 12px',borderRadius:20,cursor:'pointer'}}>
              ♪ {soundOn?'On':'Off'}
            </button>
          </div>
          <RelaxGuide beat={beat}/>
        </div>
      )}

      {step==='done'&&(
        <div style={{background:C.bg2,border:`1px solid ${C.border2}`,borderRadius:'var(--radius)',padding:'20px',textAlign:'center',animation:'fadeUp .4s ease'}}>
          <div style={{fontSize:44,color:C.gold,marginBottom:12,animation:'pulse 1.2s ease 3'}}>☽</div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:22,color:C.gold,marginBottom:8}}>Evening Complete</div>
          <p style={{fontSize:16,fontStyle:'italic',fontFamily:"'Cormorant Garamond',serif",color:C.cream2,lineHeight:1.7}}>Your shadow has been witnessed. Your body is at rest. Sleep is the deepest form of trust.</p>
          <button onClick={()=>onComplete('evening')} style={{marginTop:20,padding:'12px 32px',background:C.gold,border:'none',borderRadius:24,color:C.bg,fontFamily:"'Jost',sans-serif",fontSize:13,cursor:'pointer',fontWeight:500}}>
            Complete Evening Ritual ✦
          </button>
        </div>
      )}
    </div>
  );
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App(){
  const[tab,setTab]=useState('morning');
  const[streak,setStreak]=useState(()=>LS.get('ms_streak',0));
  const[franckls,setFranckls]=useState(()=>LS.get('ms_franckls',0));
  const[unlockedMedals,setUnlockedMedals]=useState(()=>LS.get('ms_medals',[]));
  const[completedToday,setCompletedToday]=useState(()=>LS.get('ms_today',{}));
  const[toastMedal,setToastMedal]=useState(null);
  const[morningDone,setMorningDone]=useState(false);
  const[eveningDone,setEveningDone]=useState(false);

  const checkMedals=(newStreak,currentUnlocked)=>{
    const newlyUnlocked=MEDALS.find(m=>m.days<=newStreak&&!currentUnlocked.includes(m.title)&&MEDALS.indexOf(m)===MEDALS.filter(x=>x.days<=newStreak).length-1);
    if(newlyUnlocked){
      const updated=[...currentUnlocked,newlyUnlocked.title];
      setUnlockedMedals(updated);LS.set('ms_medals',updated);
      setFranckls(f=>{const nf=f+10;LS.set('ms_franckls',nf);return nf;});
      setToastMedal(newlyUnlocked);
    }
  };

  const handleComplete=(which)=>{
    const today=new Date().toDateString();
    const todayData=LS.get('ms_today',{});
    const updated={...todayData,[which]:true};
    LS.set('ms_today',updated);setCompletedToday(updated);
    if(which==='morning')setMorningDone(true);
    if(which==='evening')setEveningDone(true);
    if(updated.morning&&updated.evening){
      const lastDay=LS.get('ms_lastday','');
      if(lastDay!==today){
        LS.set('ms_lastday',today);
        const ns=streak+1;setStreak(ns);LS.set('ms_streak',ns);
        checkMedals(ns,unlockedMedals);
      }
    }
  };

  const tabs=[
    {id:'morning',label:'Morning',icon:'☀'},
    {id:'evening',label:'Evening',icon:'☽'},
    {id:'progress',label:'Progress',icon:'◈'},
  ];

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh',background:C.bg,overflow:'hidden'}}>
      <AdBanner/>

      {/* Top status bar */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 18px',background:C.bg2,borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,color:C.gold,letterSpacing:.5}}>MindScape</div>
        <div style={{display:'flex',gap:14,alignItems:'center'}}>
          <div style={{fontSize:12,color:C.cream2}}>{streak}🔥</div>
          <div style={{fontSize:12,color:C.gold,background:'rgba(200,151,58,0.1)',border:`1px solid ${C.border2}`,padding:'2px 10px',borderRadius:20}}>₣{franckls}</div>
        </div>
      </div>

      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        {tab==='morning'&&<div style={{flex:1,overflow:'hidden'}}><MorningRitual onComplete={handleComplete}/></div>}
        {tab==='evening'&&<div style={{flex:1,overflow:'hidden'}}><EveningRitual onComplete={handleComplete}/></div>}
        {tab==='progress'&&<div style={{flex:1,overflow:'hidden'}}><ProgressScreen streak={streak} franckls={franckls} unlockedMedals={unlockedMedals}/></div>}
      </div>

      {/* Tab bar */}
      <div style={{display:'flex',borderTop:`1px solid ${C.border}`,background:C.bg2,flexShrink:0}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'10px 4px 8px',cursor:'pointer',border:'none',background:'none',color:tab===t.id?C.gold:C.muted,fontFamily:"'Jost',sans-serif",fontSize:9,letterSpacing:'1.5px',textTransform:'uppercase',transition:'color .2s',position:'relative'}}>
            <span style={{fontSize:17}}>{t.icon}</span>
            {t.label}
            {/* Done indicator */}
            {t.id==='morning'&&morningDone&&<div style={{position:'absolute',top:8,right:'28%',width:6,height:6,borderRadius:'50%',background:C.gold2}}/>}
            {t.id==='evening'&&eveningDone&&<div style={{position:'absolute',top:8,right:'28%',width:6,height:6,borderRadius:'50%',background:C.gold2}}/>}
          </button>
        ))}
      </div>

      {/* Medal toast */}
      {toastMedal&&<MedalToast medal={toastMedal} onDone={()=>setToastMedal(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
