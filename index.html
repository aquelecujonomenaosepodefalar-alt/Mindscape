// ─── HELPERS ─────────────────────────────────────────────────────────────────
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v != null ? JSON.parse(v) : d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

function makeAudio() {
  let ctx = null, oscList = [], on = false;
  return {
    start() {
      if (on) return;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const master = ctx.createGain(); master.gain.value = 0.06; master.connect(ctx.destination);
        [[174.6, 0],[261.6, 0.5],[349.2, 1.0],[523.2, 1.6]].forEach(([f, d]) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine'; o.frequency.value = f; g.gain.value = 0.5;
          o.connect(g); g.connect(master); o.start(ctx.currentTime + d);
          oscList.push(o);
        });
        on = true;
      } catch(e) {}
    },
    stop() {
      if (!on) return;
      oscList.forEach(o => { try { o.stop(); o.disconnect(); } catch {} });
      oscList = []; try { ctx && ctx.close(); } catch {} ctx = null; on = false;
    },
    isOn() { return on; }
  };
}

function say(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.82; u.pitch = 0.92; u.volume = 0.9;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => x.lang.startsWith('en') && x.name.toLowerCase().includes('male'))
           || vs.find(x => x.lang.startsWith('en')) || vs[0];
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

async function callAI(system, content) {
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 700, system, messages: [{ role: 'user', content }] }),
  });
  const d = await r.json();
  return (d.content || []).map(b => b.text || '').join('');
}

      <defs>
        <radialGradient id="rbg" cx="50%" cy="50%" r="50%">

      <circle cx="89" cy="40" r="1.8" fill={T.gold} opacity="0.6"/>
      <circle cx="101" cy="40" r="1.8" fill={T.gold} opacity="0.6"/>

      {/* neck */}
      <line x1="95" y1="59" x2="95" y2="70" stroke={T.cream2} strokeWidth="1.4"/>

      {/* shoulders */}
      <line x1="63" y1="78" x2="127" y2="78" {...sc('shoulders')} style={sw('shoulders')}/>
      <line x1="95" y1="70" x2="63" y2="78" stroke={T.cream2} strokeWidth="1.1" opacity="0.7"/>
      <line x1="95" y1="70" x2="127" y2="78" stroke={T.cream2} strokeWidth="1.1" opacity="0.7"/>

      <line x1="38" y1="106" x2="22" y2="132" {...sc('arms')} style={sw('arms')}/>

      {hl && hl !== 'none' && (

// ─── BREATH CIRCLE ────────────────────────────────────────────────────────────
function BreathCircle({ phase }) {
  const sz = phase === 'exhale' ? 46 : 76;
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:16, padding:'10px 0' }}>
      <div style={{ position:'relative', width:158, height:158, display:'flex', alignItems:'center', justifyContent:'center' }}>
        {[0,1,2].map(i => (
          <div key={i} style={{
            position:'absolute',
            width: (sz + i*26) + 'px', height: (sz + i*26) + 'px',
            borderRadius:'50%',
            border: `${i===0?1.5:0.8}px solid ${T.gold}`,
            opacity: 0.08 + i*0.07,
            transition: 'all 1.6s cubic-bezier(.4,0,.2,1)',
          }}/>
        ))}
        <div style={{
          width:sz, height:sz, borderRadius:'50%',
          background:'rgba(200,151,58,0.08)',
          border:`1.5px solid ${T.gold}`,
          display:'flex', alignItems:'center', justifyContent:'center',
          transition:'all 1.6s cubic-bezier(.4,0,.2,1)',
        }}>
          <span style={{ fontSize:10, letterSpacing:2, color:T.gold, textTransform:'uppercase' }}>
            {phase === 'inhale' ? 'Inhale' : phase === 'hold' ? 'Hold' : 'Exhale'}
          </span>
        </div>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:6, width:'88%' }}>
        {[['Inhale','4'],['Hold','7'],['Exhale','8']].map(([l,n]) => (
          <div key={l} style={{
            textAlign:'center', padding:'8px 4px',
            background: phase === l.toLowerCase() ? 'rgba(200,151,58,0.1)' : T.bg3,
            border: `1px solid ${phase === l.toLowerCase() ? T.b2 : T.b1}`,
            borderRadius:10, transition:'all .5s',
          }}>
            <div style={{ fontSize:10, color: phase === l.toLowerCase() ? T.gold : T.muted }}>{l}</div>
            <div style={{ fontSize:20, color:T.cream, fontFamily:"'Cormorant Garamond',serif" }}>{n}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── MORNING RITUAL ──────────────────────────────────────────────────────────
function MorningRitual({ onComplete }) {
  const [step, setStep] = useState('intro');
  const [breathPhase, setBreathPhase] = useState('inhale');
  const [breathCycle, setBreathCycle] = useState(0);
  const [dream, setDream] = useState('');
  const [freudText, setFreudText] = useState('');
  const [loading, setLoading] = useState(false);
  const [soundOn, setSoundOn] = useState(true);
  const audio = useRef(null);
  const breathTimer = useRef(null);

  useEffect(() => {
    audio.current = makeAudio();
    return () => {
      audio.current.stop();
      clearInterval(breathTimer.current);
      window.speechSynthesis && window.speechSynthesis.cancel();
    };
  }, []);

  function startBreath() {
    setStep('breath');
    audio.current.start();
    const SEQ = [
      { phase:'inhale', secs:4, cue:'Inhale slowly… one… two… three… four…' },
      { phase:'hold',   secs:7, cue:'Hold… one… two… three… four… five… six… seven…' },
      { phase:'exhale', secs:8, cue:'Exhale slowly… one… two… three… four… five… six… seven… eight…' },
    ];
    let si = 0, tick = 0, cycles = 0;
    setBreathPhase('inhale');
    say(SEQ[0].cue);
    breathTimer.current = setInterval(() => {
      tick++;
      if (tick >= SEQ[si].secs) {
        tick = 0;
        si = (si + 1) % 3;
        if (si === 0) { cycles++; setBreathCycle(cycles); }
        if (cycles >= 4) {
          clearInterval(breathTimer.current);
          audio.current.stop();
          window.speechSynthesis && window.speechSynthesis.cancel();
          setStep('dream');
          return;
        }
        setBreathPhase(SEQ[si].phase);
        say(SEQ[si].cue);
      }
    }, 1000);
  }

  async function submitDream() {
    if (!dream.trim()) return;
    setLoading(true);
    setStep('freud');
    try {
      const reply = await callAI(FREUD_SYSTEM, `My dream: "${dream}"`);
      setFreudText(reply || 'The unconscious speaks in symbols we are not yet ready to hear. Return to this dream tonight.');
    } catch {
      setFreudText('The connection was interrupted. Simply sit with the image your dream left behind. What lingers is what matters.\n\n— Freud');
    }
    setLoading(false);
  }

  const Box = ({ children }) => (
    <div style={{ background:T.bg2, border:`1px solid ${T.b2}`, borderRadius:14, padding:20, animation:'fadeUp .4s ease' }}>
      {children}
    </div>
  );

  return (
    <div style={{ height:'100%', overflowY:'auto', padding:'20px 18px 100px' }}>
      <div style={{ marginBottom:20 }}>
        <div style={{ fontSize:9, letterSpacing:3, color:T.gold, textTransform:'uppercase', marginBottom:4 }}>Morning Ritual</div>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:26, fontWeight:300 }}>☀ Awakening Practice</div>
        <p style={{ fontSize:13, color:T.cream2, marginTop:5, lineHeight:1.6 }}>Begin with the breath. Then bring what the night left behind.</p>
      </div>

      {step === 'intro' && (
        <Box>
          <div style={{ textAlign:'center', padding:'10px 0' }}>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:40, color:T.gold, opacity:.45, marginBottom:14 }}>◎</div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:20, color:T.cream, marginBottom:10 }}>4 · 7 · 8 Breathwork</div>
            <p style={{ fontSize:16, fontStyle:'italic', fontFamily:"'Cormorant Garamond',serif", color:T.cream2, lineHeight:1.7, marginBottom:12 }}>
              Four complete cycles. Inhale four, hold seven, exhale eight. This practice activates the parasympathetic nervous system — the body's own off switch for stress.
            </p>
            <p style={{ fontSize:12, color:T.muted, marginBottom:24 }}>Voice guidance will lead each breath.</p>
            <button onClick={startBreath} style={{ padding:'13px 42px', background:T.gold, border:'none', borderRadius:30, color:T.bg, fontFamily:"'Jost',sans-serif", fontSize:14, letterSpacing:1, cursor:'pointer', fontWeight:500 }}>
              Begin Breathwork
            </button>
          </div>
        </Box>
      )}

      {step === 'breath' && (
        <Box>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 }}>
            <div style={{ fontSize:12, color:T.muted }}>Cycle {breathCycle + 1} of 4</div>
            <button onClick={() => { setSoundOn(s => { const n=!s; n ? audio.current.start() : audio.current.stop(); return n; })} } style={{ fontSize:11, color:soundOn?T.gold:T.muted, background:'none', border:`1px solid ${T.b1}`, padding:'3px 12px', borderRadius:20, cursor:'pointer' }}>
              ♪ {soundOn ? 'On' : 'Off'}
            </button>
          </div>
          <BreathCircle phase={breathPhase}/>
        </Box>
      )}

      {step === 'dream' && (
        <Box>
          <div style={{ fontSize:9, letterSpacing:3, color:T.gold, textTransform:'uppercase', marginBottom:4 }}>Sigmund Freud</div>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:20, color:T.cream, marginBottom:8 }}>Dream Analysis</div>
          <p style={{ fontSize:16, fontStyle:'italic', fontFamily:"'Cormorant Garamond',serif", color:T.cream2, lineHeight:1.7, marginBottom:14 }}>
            "Dreams are the royal road to the unconscious."
          </p>
          <p style={{ fontSize:13, color:T.cream2, marginBottom:12, lineHeight:1.6 }}>
            Describe your dream in one sentence — the image, the feeling, or the fragment that stayed with you.
          </p>
          <textarea
            value={dream}
            onChange={e => setDream(e.target.value)}
            placeholder="Last night I dreamed that…"
            rows={3}
            style={{ width:'100%', background:T.bg3, border:`1px solid ${T.b1}`, borderRadius:10, padding:'12px 14px', color:T.cream, fontSize:16, lineHeight:1.8, fontFamily:"'Cormorant Garamond',serif", marginBottom:12 }}
          />
          <div style={{ display:'flex', gap:10 }}>
            <button onClick={() => { setStep('done'); onComplete('morning'); }} style={{ flex:1, padding:'10px', background:'transparent', border:`1px solid ${T.b1}`, borderRadius:24, color:T.muted, fontFamily:"'Jost',sans-serif", fontSize:12, cursor:'pointer' }}>
              No dream recalled
            </button>
            <button onClick={submitDream} disabled={!dream.trim()} style={{ flex:2, padding:'10px', background:dream.trim()?T.gold:'transparent', border:`1px solid ${dream.trim()?T.gold:T.b1}`, borderRadius:24, color:dream.trim()?T.bg:T.muted, fontFamily:"'Jost',sans-serif", fontSize:13, cursor:dream.trim()?'pointer':'default', fontWeight:500 }}>
              Interpret with Freud →
            </button>
          </div>
        </Box>
      )}

      {step === 'freud' && (
        <Box>
          <div style={{ fontSize:9, letterSpacing:3, color:T.gold, textTransform:'uppercase', marginBottom:6 }}>Freud's Interpretation</div>
          <div style={{ background:T.bg3, border:`1px solid ${T.b1}`, borderRadius:10, padding:'12px 14px', marginBottom:16, fontStyle:'italic', color:T.cream2, fontSize:15, fontFamily:"'Cormorant Garamond',serif", lineHeight:1.7 }}>
            "{dream}"
          </div>
          {loading ? (
            <div style={{ textAlign:'center', padding:'30px 0' }}>
              <div style={{ fontSize:30, color:T.gold, marginBottom:10, animation:'shimmer 1.4s ease-in-out infinite' }}>Ψ</div>
              <p style={{ fontSize:15, fontStyle:'italic', fontFamily:"'Cormorant Garamond',serif", color:T.muted }}>Freud is considering your dream…</p>
            </div>
          ) : (
            <div>
              <p style={{ fontSize:16, color:T.cream, lineHeight:1.85, fontFamily:"'Cormorant Garamond',serif", marginBottom:20, whiteSpace:'pre-wrap' }}>{freudText}</p>
              <button onClick={() => { setStep('done'); onComplete('morning'); }} style={{ width:'100%', padding:12, background:T.gold, border:'none', borderRadius:24, color:T.bg, fontFamily:"'Jost',sans-serif", fontSize:13, cursor:'pointer', fontWeight:500 }}>
                Complete Morning Ritual ✦
              </button>
            </div>
          )}
        </Box>
      )}

      {step === 'done' && (
        <Box>
          <div style={{ textAlign:'center', padding:'10px 0' }}>
            <div style={{ fontSize:44, color:T.gold, marginBottom:12, animation:'pulse 1.2s ease 3' }}>✦</div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:22, color:T.gold, marginBottom:8 }}>Morning Complete</div>
            <p style={{ fontSize:16, fontStyle:'italic', fontFamily:"'Cormorant Garamond',serif", color:T.cream2, lineHeight:1.7 }}>
              Your nervous system is calmer. Your unconscious has been heard. Go forward with intention.
            </p>
          </div>
        </Box>
      )}
    </div>
  );
}

// ─── EVENING RITUAL ───────────────────────────────────────────────────────────
function EveningRitual({ onComplete }) {
  const [step, setStep] = useState('intro');
  const [qIdx, setQIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [jungText, setJungText] = useState('');
  const [loading, setLoading] = useState(false);
  const [relaxBeat, setRelaxBeat] = useState(0);
  const [soundOn, setSoundOn] = useState(true);
  const audio = useRef(null);
  const relaxTimer = useRef(null);

  useEffect(() => {
    audio.current = makeAudio();
    return () => {
      audio.current.stop();
      clearInterval(relaxTimer.current);
      window.speechSynthesis && window.speechSynthesis.cancel();
    };
  }, []);

  async function submitShadow() {
    setStep('jung');
    setLoading(true);
    const prompt = SHADOW_Q.map(q => `${q.q}\n${answers[q.key] || '(no answer)'}`).join('\n\n');
    try {
      const reply = await callAI(JUNG_SYSTEM, prompt);
      setJungText(reply || 'What you have named tonight is already beginning to transform. The shadow, once seen, loses its power to direct from the dark. Return to these words tomorrow.\n\n— Jung');
    } catch {
      setJungText('The shadow you have named tonight is the beginning of integration. What disturbs us most is what we have not yet owned. Rest with this.\n\n— Jung');
    }
    setLoading(false);
  }

  function startRelax() {
    setStep('relax');
    audio.current.start();
    say('We begin progressive relaxation. Follow the body guide. Tense each area for five seconds, then fully release.');
    let b = 0;
    relaxTimer.current = setInterval(() => {
      b++;
      setRelaxBeat(b);
      const idx = Math.min(Math.floor(b / 3), RELAX.length - 1);
      if (b % 3 === 1 && b > 1) say(RELAX[idx].cue);
      if (b >= RELAX.length * 3 + 1) {
        clearInterval(relaxTimer.current);
        audio.current.stop();
        say('Beautiful. Your body is at rest. Sleep well.');
        setTimeout(() => setStep('done'), 3500);
      }
    }, 3500);
  }

  const curQ = SHADOW_Q[qIdx];
  const curAns = answers[curQ.key] || '';

  const Box = ({ children, extra }) => (
    <div style={{ background:T.bg2, border:`1px solid ${T.b2}`, borderRadius:14, padding:20, animation:'fadeUp .4s ease', ...extra }}>
      {children}
    </div>
  );

  const relaxIdx = Math.min(Math.floor(relaxBeat / 3), RELAX.length - 1);

  return (
    <div style={{ height:'100%', overflowY:'auto', padding:'20px 18px 100px' }}>
      <div style={{ marginBottom:20 }}>
        <div style={{ fontSize:9, letterSpacing:3, color:T.gold, textTransform:'uppercase', marginBottom:4 }}>Evening Ritual</div>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:26, fontWeight:300 }}>☽ Night Practice</div>
        <p style={{ fontSize:13, color:T.cream2, marginTop:5, lineHeight:1.6 }}>Shadow work with Jung. Progressive relaxation with the body.</p>
      </div>

      {step === 'intro' && (
        <Box>
          <div style={{ textAlign:'center', padding:'10px 0' }}>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:40, color:T.gold, opacity:.4, marginBottom:12 }}>☽</div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:20, color:T.cream, marginBottom:10 }}>Shadow Journal</div>
            <p style={{ fontSize:16, fontStyle:'italic', fontFamily:"'Cormorant Garamond',serif", color:T.cream2, lineHeight:1.7, marginBottom:12 }}>
              "Until you make the unconscious conscious, it will direct your life and you will call it fate."
            </p>
            <p style={{ fontSize:12, color:T.muted, marginBottom:24 }}>Four questions. Jung will read your answers and respond.</p>
            <button onClick={() => setStep('shadow')} style={{ padding:'13px 42px', background:T.gold, border:'none', borderRadius:30, color:T.bg, fontFamily:"'Jost',sans-serif", fontSize:14, letterSpacing:1, cursor:'pointer', fontWeight:500 }}>
              Open Shadow Journal
            </button>
          </div>
        </Box>
      )}

      {step === 'shadow' && (
        <Box>
          <div style={{ display:'flex', gap:5, justifyContent:'center', marginBottom:18 }}>
            {SHADOW_Q.map((_, i) => (
              <div key={i} style={{ width:7, height:7, borderRadius:'50%', background: i === qIdx ? T.gold : i < qIdx ? T.muted : T.bg4, border:`1px solid ${i <= qIdx ? T.gold : T.b1}`, transition:'all .3s' }}/>
            ))}
          </div>
          <div style={{ fontSize:9, letterSpacing:3, color:T.gold, textTransform:'uppercase', marginBottom:6 }}>Question {qIdx + 1} of {SHADOW_Q.length}</div>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:20, color:T.cream, marginBottom:14, lineHeight:1.4 }}>{curQ.q}</div>
          <textarea
            key={qIdx}
            value={curAns}
            onChange={e => setAnswers(a => ({ ...a, [curQ.key]: e.target.value }))}
            placeholder={curQ.ph}
            rows={4}
            autoFocus
            style={{ width:'100%', background:T.bg3, border:`1px solid ${T.b1}`, borderRadius:10, padding:'12px 14px', color:T.cream, fontSize:16, lineHeight:1.8, fontFamily:"'Cormorant Garamond',serif", marginBottom:14 }}
          />
          <div style={{ display:'flex', gap:10 }}>
            {qIdx > 0 && (
              <button onClick={() => setQIdx(q => q - 1)} style={{ padding:'10px 18px', background:'transparent', border:`1px solid ${T.b1}`, borderRadius:24, color:T.muted, fontFamily:"'Jost',sans-serif", fontSize:12, cursor:'pointer' }}>
                ← Back
              </button>
            )}
            <button onClick={() => { if (qIdx < SHADOW_Q.length - 1) setQIdx(q => q + 1); else submitShadow(); }} disabled={!curAns.trim()} style={{ flex:1, padding:'10px', background:curAns.trim()?T.gold:'transparent', border:`1px solid ${curAns.trim()?T.gold:T.b1}`, borderRadius:24, color:curAns.trim()?T.bg:T.muted, fontFamily:"'Jost',sans-serif", fontSize:13, cursor:curAns.trim()?'pointer':'default', fontWeight:500 }}>
              {qIdx < SHADOW_Q.length - 1 ? 'Next Question →' : 'Send to Jung →'}
            </button>
          </div>
        </Box>
      )}

      {step === 'jung' && (
        <Box>
          <div style={{ fontSize:9, letterSpacing:3, color:T.gold, textTransform:'uppercase', marginBottom:6 }}>Jung's Response</div>
          {loading ? (
            <div style={{ textAlign:'center', padding:'30px 0' }}>
              <div style={{ fontSize:30, color:T.gold, marginBottom:10, animation:'shimmer 1.4s ease-in-out infinite' }}>☽</div>
              <p style={{ fontSize:15, fontStyle:'italic', fontFamily:"'Cormorant Garamond',serif", color:T.muted }}>Jung is reading your shadow…</p>
            </div>
          ) : (
            <div>
              <p style={{ fontSize:16, color:T.cream, lineHeight:1.85, fontFamily:"'Cormorant Garamond',serif", marginBottom:20, whiteSpace:'pre-wrap' }}>{jungText}</p>
              <button onClick={startRelax} style={{ width:'100%', padding:12, background:T.gold, border:'none', borderRadius:24, color:T.bg, fontFamily:"'Jost',sans-serif", fontSize:13, cursor:'pointer', fontWeight:500 }}>
                Continue to Body Relaxation →
              </button>
            </div>
          )}
        </Box>
      )}

      {step === 'relax' && (
        <Box>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
            <div>
              <div style={{ fontSize:9, letterSpacing:3, color:T.gold, textTransform:'uppercase', marginBottom:2 }}>Edmund Jacobson</div>
              <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:18, color:T.cream }}>Progressive Relaxation</div>
            </div>
            <button onClick={() => { setSoundOn(s => { const n=!s; n ? audio.current.start() : audio.current.stop(); return n; })} } style={{ fontSize:11, color:soundOn?T.gold:T.muted, background:'none', border:`1px solid ${T.b1}`, padding:'3px 12px', borderRadius:20, cursor:'pointer' }}>
              ♪ {soundOn ? 'On' : 'Off'}
            </button>
          </div>
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:12 }}>
            <Vitruvian hl={RELAX[relaxIdx].id}/>
            <div style={{ textAlign:'center' }}>
              <div style={{ fontSize:14, color:T.gold, letterSpacing:1, marginBottom:4 }}>{RELAX[relaxIdx].label}</div>
              <p style={{ fontSize:15, fontStyle:'italic', fontFamily:"'Cormorant Garamond',serif", color:T.cream2, lineHeight:1.6 }}>{RELAX[relaxIdx].cue}</p>
              <div style={{ display:'flex', gap:4, justifyContent:'center', marginTop:12 }}>
                {RELAX.map((_, i) => (
                  <div key={i} style={{ width:6, height:6, borderRadius:'50%', background: i === relaxIdx ? T.gold : i < relaxIdx ? T.muted : T.bg4, transition:'all .4s' }}/>
                ))}
              </div>
            </div>
          </div>
        </Box>
      )}

      {step === 'done' && (
        <Box>
          <div style={{ textAlign:'center', padding:'10px 0' }}>
            <div style={{ fontSize:44, color:T.gold, marginBottom:12, animation:'pulse 1.2s ease 3' }}>☽</div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:22, color:T.gold, marginBottom:8 }}>Evening Complete</div>
            <p style={{ fontSize:16, fontStyle:'italic', fontFamily:"'Cormorant Garamond',serif", color:T.cream2, lineHeight:1.7 }}>
              Your shadow has been witnessed. Your body is at rest. Sleep is the deepest form of trust.
            </p>
            <button onClick={() => onComplete('evening')} style={{ marginTop:20, padding:'12px 32px', background:T.gold, border:'none', borderRadius:24, color:T.bg, fontFamily:"'Jost',sans-serif", fontSize:13, cursor:'pointer', fontWeight:500 }}>
              Complete Evening Ritual ✦
            </button>
          </div>
        </Box>
      )}
    </div>
  );
}

// ─── PROGRESS SCREEN ──────────────────────────────────────────────────────────
function ProgressScreen({ streak, franckls, unlocked }) {
  const lastMedal = [...MEDALS].reverse().find(m => unlocked.includes(m.name));
  const nextMedal = MEDALS.find(m => !unlocked.includes(m.name));
  const pct = nextMedal ? Math.min((streak / nextMedal.days) * 100, 100) : 100;

  return (
    <div style={{ height:'100%', overflowY:'auto', padding:'20px 18px 100px' }}>
      <div style={{ marginBottom:20 }}>
        <div style={{ fontSize:9, letterSpacing:3, color:T.gold, textTransform:'uppercase', marginBottom:4 }}>Your Journey</div>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:26, fontWeight:300 }}>Progress & Rank</div>
      </div>

      {/* Stats */}
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:14 }}>
        {[
          { label:'Day Streak', value: streak + ' 🔥', sub: streak === 1 ? '1 consecutive day' : `${streak} consecutive days` },
          { label:'Franckls',   value: '₣' + franckls,  sub: franckls >= 100 ? '✦ Ready to redeem!' : `₣${100-franckls} until store` },
        ].map(s => (
          <div key={s.label} style={{ background:T.bg2, border:`1px solid ${T.b2}`, borderRadius:14, padding:'16px 12px', textAlign:'center' }}>
            <div style={{ fontSize:9, letterSpacing:2, color:T.muted, textTransform:'uppercase', marginBottom:6 }}>{s.label}</div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:26, color:T.gold }}>{s.value}</div>
            <div style={{ fontSize:10, color:T.muted, marginTop:4 }}>{s.sub}</div>
          </div>
        ))}
      </div>

      {/* Current rank */}
      {lastMedal ? (
        <div style={{ background:'rgba(200,151,58,0.06)', border:`1px solid ${T.b2}`, borderRadius:14, padding:16, marginBottom:14, textAlign:'center' }}>
          <div style={{ fontSize:9, letterSpacing:2, color:T.muted, textTransform:'uppercase', marginBottom:4 }}>Current Rank</div>
          <div style={{ fontSize:46, marginBottom:6 }}>{lastMedal.icon}</div>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:22, color:T.gold }}>{lastMedal.name}</div>
          <div style={{ fontSize:12, color:T.cream2, marginTop:4, fontStyle:'italic' }}>{lastMedal.note}</div>
        </div>
      ) : (
        <div style={{ background:T.bg2, border:`1px solid ${T.b1}`, borderRadius:14, padding:16, marginBottom:14, textAlign:'center' }}>
          <p style={{ fontSize:14, color:T.cream2, fontStyle:'italic', fontFamily:"'Cormorant Garamond',serif" }}>Complete 3 days to earn your first rank.</p>
        </div>
      )}

      {/* Next rank progress */}
      {nextMedal && (
        <div style={{ background:T.bg2, border:`1px solid ${T.b1}`, borderRadius:14, padding:'14px 16px', marginBottom:14 }}>
          <div style={{ fontSize:9, letterSpacing:2, color:T.muted, textTransform:'uppercase', marginBottom:10 }}>Next Rank</div>
          <div style={{ display:'flex', alignItems:'center', gap:14 }}>
            <div style={{ fontSize:34, opacity:.5, flexShrink:0 }}>{nextMedal.icon}</div>
            <div style={{ flex:1 }}>
              <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:18, color:T.cream, marginBottom:4 }}>{nextMedal.name}</div>
              <div style={{ fontSize:11, color:T.muted, marginBottom:8 }}>{nextMedal.days - streak} more days</div>
              <div style={{ height:3, background:T.bg3, borderRadius:3 }}>
                <div style={{ height:'100%', width: pct + '%', background:T.gold, borderRadius:3, transition:'width .5s' }}/>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* All medals */}
      <div style={{ fontSize:10, letterSpacing:2, color:T.muted, textTransform:'uppercase', marginBottom:10 }}>All Ranks</div>
      <div style={{ display:'flex', flexDirection:'column', gap:7, marginBottom:20 }}>
        {MEDALS.map(m => {
          const ok = unlocked.includes(m.name);
          return (
            <div key={m.name} style={{ display:'flex', alignItems:'center', gap:12, background: ok ? 'rgba(200,151,58,0.06)' : T.bg2, border:`1px solid ${ok?T.b2:T.b1}`, borderRadius:10, padding:'11px 14px', opacity: ok ? 1 : 0.55, transition:'all .3s' }}>
              <div style={{ fontSize:20, width:30, textAlign:'center', filter: ok ? 'none' : 'grayscale(1)' }}>{m.icon}</div>
              <div style={{ flex:1 }}>
                <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:15, color: ok ? T.gold : T.cream2 }}>{m.name}</div>
                <div style={{ fontSize:11, color:T.muted }}>{m.days} days · {m.note}</div>
              </div>
              {ok ? <div style={{ fontSize:10, color:T.gold, border:`1px solid ${T.b2}`, padding:'2px 8px', borderRadius:10 }}>✦</div>
                  : <div style={{ fontSize:10, color:T.muted }}>+₣10</div>}
            </div>
          );
        })}
      </div>

      {/* Store */}
      <div style={{ background:T.bg2, border:`1px solid ${T.b1}`, borderRadius:14, padding:16, textAlign:'center' }}>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:18, color:T.cream, marginBottom:6 }}>◈ Franckls Store</div>
        <p style={{ fontSize:13, color:T.cream2, lineHeight:1.6, marginBottom:12 }}>Redeem ₣100 Franckls for real items: premium content, physical books, and exclusive ritual guides.</p>
        <div style={{ padding:'10px', background:T.bg3, border:`1px solid ${T.b1}`, borderRadius:10, fontSize:12, color:T.muted }}>
          Store opens at ₣100 · You have ₣{franckls}
        </div>
      </div>
    </div>
  );
}

// ─── APP ROOT ──────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('morning');
  const [streak, setStreak] = useState(() => LS.get('ms_streak', 0));
  const [franckls, setFranckls] = useState(() => LS.get('ms_franckls', 0));
  const [unlocked, setUnlocked] = useState(() => LS.get('ms_unlocked', []));
  const [toast, setToast] = useState(null);
  const [mDone, setMDone] = useState(false);
  const [eDone, setEDone] = useState(false);

  function handleComplete(which) {
    if (which === 'morning') setMDone(true);
    if (which === 'evening') setEDone(true);
    const today = new Date().toDateString();
    const prev = LS.get('ms_today', {});
    const updated = { ...prev, [which]: true };
    LS.set('ms_today', updated);
    if (updated.morning && updated.evening && LS.get('ms_lastday','') !== today) {
      LS.set('ms_lastday', today);
      const ns = streak + 1;
      setStreak(ns); LS.set('ms_streak', ns);
      const newMedal = MEDALS.slice().reverse().find(m => m.days <= ns && !unlocked.includes(m.name));
      if (newMedal) {
        const nu = [...unlocked, newMedal.name];
        setUnlocked(nu); LS.set('ms_unlocked', nu);
        const nf = franckls + 10;
        setFranckls(nf); LS.set('ms_franckls', nf);
        setToast(newMedal);
      }
    }
  }

  const tabs = [
    { id:'morning',  label:'Morning',  icon:'☀' },
    { id:'evening',  label:'Evening',  icon:'☽' },
    { id:'progress', label:'Progress', icon:'◈' },
  ];

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh', background:T.bg, overflow:'hidden' }}>
      <AdBanner/>

      {/* Header */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 18px', background:T.bg2, borderBottom:`1px solid ${T.b1}`, flexShrink:0 }}>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:18, color:T.gold, letterSpacing:.5 }}>MindScape</div>
        <div style={{ display:'flex', gap:12, alignItems:'center' }}>
          <span style={{ fontSize:12, color:T.cream2 }}>{streak}🔥</span>
          <span style={{ fontSize:12, color:T.gold, background:'rgba(200,151,58,0.1)', border:`1px solid ${T.b2}`, padding:'2px 10px', borderRadius:20 }}>₣{franckls}</span>
        </div>
      </div>

      {/* Content */}
      <div style={{ flex:1, overflow:'hidden' }}>
        {tab === 'morning'  && <MorningRitual  key="m" onComplete={handleComplete}/>}
        {tab === 'evening'  && <EveningRitual  key="e" onComplete={handleComplete}/>}
        {tab === 'progress' && <ProgressScreen streak={streak} franckls={franckls} unlocked={unlocked}/>}
      </div>

      {/* Tab bar */}
      <div style={{ display:'flex', borderTop:`1px solid ${T.b1}`, background:T.bg2, flexShrink:0 }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:3, padding:'10px 4px 8px', cursor:'pointer', border:'none', background:'none', color: tab === t.id ? T.gold : T.muted, fontFamily:"'Jost',sans-serif", fontSize:9, letterSpacing:'1.5px', textTransform:'uppercase', transition:'color .2s', position:'relative' }}>
            <span style={{ fontSize:17 }}>{t.icon}</span>
            {t.label}
            {t.id === 'morning' && mDone && <div style={{ position:'absolute', top:8, right:'26%', width:6, height:6, borderRadius:'50%', background:T.gold2 }}/>}
            {t.id === 'evening' && eDone && <div style={{ position:'absolute', top:8, right:'26%', width:6, height:6, borderRadius:'50%', background:T.gold2 }}/>}
          </button>
        ))}
      </div>

      {toast && <MedalToast medal={toast} onDone={() => setToast(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
