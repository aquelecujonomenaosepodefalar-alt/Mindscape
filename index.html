function makeAudio(){
  let ctx=null,oscs=[],on=false;
  return{
    start(){if(on)return;try{ctx=new(window.AudioContext||window.webkitAudioContext)();const m=ctx.createGain();m.gain.value=0.055;m.connect(ctx.destination);[[174.6,0],[261.6,.5],[349.2,1],[523.2,1.6]].forEach(([f,d])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.5;o.connect(g);g.connect(m);o.start(ctx.currentTime+d);oscs.push(o);});on=true;}catch{}},
    stop(){if(!on)return;oscs.forEach(o=>{try{o.stop();o.disconnect();}catch{}});oscs=[];try{ctx&&ctx.close();}catch{};ctx=null;on=false;},
  };
}

function say(text,lang){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=0.78;u.pitch=0.68;u.volume=0.92;u.lang=VOICE_LANG[lang]||'en-GB';const vs=speechSynthesis.getVoices();let v=vs.find(x=>x.lang.startsWith(lang==='pt'?'pt':lang==='es'?'es':'en'));if(v)u.voice=v;speechSynthesis.speak(u);}
function stopVoice(){window.speechSynthesis&&speechSynthesis.cancel();}

  const d=await r.json();return(d.content||[]).map(b=>b.text||'').join('');
}

function scheduleLocalNotifications(lang){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  setInterval(()=>{const now=new Date(),h=now.getHours(),m=now.getMinutes();const last=LS.get('pg_last_notif','');const tk=now.toDateString();
    if(h===8&&m===0&&last!==tk+'_m'){new Notification('\u2600 The Psychic Gate',{body:NOTIF_MSGS[lang].m});LS.set('pg_last_notif',tk+'_m');}
    if(h===21&&m===0&&last!==tk+'_e'){new Notification('\u263d The Psychic Gate',{body:NOTIF_MSGS[lang].e});LS.set('pg_last_notif',tk+'_e');}
  },60000);
}

function EvolvingVitruvian({stage,hl,size=1}){

  const sc=(p)=>({stroke:h===p?T.gold2:bodyColor,strokeWidth:h===p?2.5:bodyW});
  const an=(p)=>h===p?{animation:'glow 1.2s ease-in-out infinite'}:{};
  const W=180*size,H=220*size;
  return(
    <div style={{position:'relative',width:W,height:H,display:'flex',alignItems:'center',justifyContent:'center'}}>
      {stage>=5&&(
        <div style={{position:'absolute',inset:-14*size,borderRadius:'50%',border:`1px solid ${T.b2}`,animation:'auraSpin 40s linear infinite'}}>
          {[0,45,90,135,180,225,270,315].map(deg=>(
            <div key={deg} style={{position:'absolute',top:'50%',left:'50%',width:4,height:4,borderRadius:'50%',background:T.gold2,transform:`rotate(${deg}deg) translateX(${(W/2+12*size)}px)`,transformOrigin:'0 0',opacity:.7}}/>
          ))}

      {stage>=2&&<div style={{position:'absolute',inset:-4*size,borderRadius:'50%',border:`1.5px solid ${T.gold}`,opacity:.35,animation:'breathe 4s ease-in-out infinite'}}/>}

  const GOAL_ICONS=['\u25c7','\u25ce','\u03a8','\u263d','\u25c8','\u25cb'];
  const TIME_VALS=['5','10','15'];
  const SESS_VALS=['morning','evening','both'];
  const SESS_ICONS=['\u2600','\u263d','\u25c8'];
  const QUESTIONS=lang?[
    {key:'goal',title:S.obQ1,sub:S.obQ1sub,options:S.obG.map((l,i)=>({v:GOAL_VALS[i],label:l,icon:GOAL_ICONS[i]}))},
    {key:'time',title:S.obQ2,sub:S.obQ2sub,options:S.obT.map((l,i)=>({v:TIME_VALS[i],label:l,icon:['\u25cc','\u25ce','\u2b21'][i]}))},
    {key:'session',title:S.obQ3,sub:S.obQ3sub,options:S.obS.map((l,i)=>({v:SESS_VALS[i],label:l,icon:SESS_ICONS[i]}))},
  ]:[];
  function chooseAnswer(key,val){setAnswers(a=>({...a,[key]:val}));setTimeout(()=>setStep(s=>s+1),250);}
  async function requestNotifications(){
    if(!('Notification' in window)){setNotifChoice('unsupported');setTimeout(()=>setStep(s=>s+1),900);return;}
    try{const p=await Notification.requestPermission();setNotifChoice(p);if(p==='granted')new Notification('\u263d The Psychic Gate',{body:S.obNotifMsg});}catch{setNotifChoice('denied');}
    setTimeout(()=>setStep(s=>s+1),900);
  }
  function finish(){LS.set('pg_onboarded',true);LS.set('pg_lang',lang);LS.set('pg_profile',answers);onDone(lang,answers);}

    const map={clarity:['frankl','beck'],anxiety:['breath478','relax'],dreams:['freud'],shadow:['shadow1','lacan'],meaning:['frankl','seligman'],explore:['frankl','breath478']};
    return(map[answers.goal]||['frankl','breath478']).map(id=>RITUALS.find(r=>r.id===id)).filter(Boolean);
  },[answers.goal]);

  if(!lang){
    return(

          {[['pt','Portugu\u00eas','\ud83c\udde7\ud83c\uddf7'],['en','English','\ud83c\uddfa\ud83c\uddf8'],['es','Espa\u00f1ol','\ud83c\uddea\ud83c\uddf8']].map(([code,label,flag])=>(

function buildDailyPath(profile,mood,session){
  const goal=profile?.goal||'explore';
  const pool=RITUALS.filter(r=>r.session===session);
  const ids=[];
  if(session==='morning'){
    ids.push('breath478');
    if(goal==='dreams')ids.push('freud');else if(goal==='clarity'||goal==='meaning')ids.push('frankl');else if(mood==='anxious')ids.push('reich');else ids.push('frankl');
  }else{
    if(mood==='anxious'||mood==='angry')ids.push('beck');else if(goal==='shadow')ids.push('shadow1');else if(goal==='meaning')ids.push('seligman');else ids.push('shadow1');
    ids.push('relax');
  }
  return ids.map(id=>pool.find(r=>r.id===id)).filter(Boolean);
}
function DailyPath({S,lang,path,checked,onOpen}){
  const done=path.filter(r=>checked[r.id]).length;
  const total=path.length;

    <div style={{background:T.bg2,border:`1.5px solid ${T.b2}`,borderRadius:16,padding:'14px 16px',marginBottom:16}}>

        <div style={{fontSize:13,color:T.gold,fontFamily:"'Cormorant Garamond',serif"}}>{done}/{total}</div>
      </div>
      <div style={{display:'flex',gap:6,marginBottom:12}}>{path.map(r=>(<div key={r.id} style={{flex:1,height:3,background:checked[r.id]?T.gold:T.bg3,borderRadius:3,transition:'all .4s'}}/>))}</div>

      {!allDone&&next&&(<button onClick={()=>onOpen(next)} style={{width:'100%',padding:10,background:T.gold,border:'none',borderRadius:24,color:T.bg,fontFamily:"'Jost',sans-serif",fontSize:13,cursor:'pointer',fontWeight:500}}>{done===0?S.pathStart:S.pathContinue}</button>)}

    const SEQ=BREATH_CUES[lang];let si=0,tick=0,cycles=0;setBreathPhase('inhale');say(SEQ[0].c,lang);
    timer.current=setInterval(()=>{tick++;if(tick>=SEQ[si].s){tick=0;si=(si+1)%3;if(si===0){cycles++;setBreathCycle(cycles);}if(cycles>=4){clearInterval(timer.current);audio.current.stop();stopVoice();setStep('done');onDone(ritual.id);return;}setBreathPhase(SEQ[si].p);say(SEQ[si].c,lang);}},1000);

                <div>

                  <p style={{fontSize:16,color:T.cream,lineHeight:1.85,fontFamily:"'Cormorant Garamond',serif",marginBottom:20,whiteSpace:'pre-wrap'}}>{aiReply}</p>
                  <button onClick={()=>{setStep('done');onDone(ritual.id);}} style={{width:'100%',padding:12,background:T.gold,border:'none',borderRadius:24,color:T.bg,fontFamily:"'Jost',sans-serif",fontSize:13,cursor:'pointer',fontWeight:500}}>{S.complete}</button>
                </div>
              )}
            </div>
          )}
          {step==='done'&&(
            <div style={{textAlign:'center',paddingBottom:8}}>
              <div style={{fontSize:44,color:T.gold,marginBottom:12,animation:'pulse 1.2s ease 3'}}>{ritual.icon}</div>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:22,color:T.gold,marginBottom:8}}>{S.doneT}</div>
              <p style={{fontSize:15,fontStyle:'italic',fontFamily:"'Cormorant Garamond',serif",color:T.cream2,lineHeight:1.7}}>{ritual.type==='breath'?S.doneBreath:ritual.type==='relax'?S.doneRelax:ritual.type==='move'?S.doneMove:S.doneJournal}</p>
              <button onClick={onClose} style={{marginTop:20,padding:'10px 28px',background:'transparent',border:`1px solid ${T.b2}`,borderRadius:24,color:T.gold,fontFamily:"'Jost',sans-serif",fontSize:13,cursor:'pointer',width:'100%'}}>{S.close}</button>

}

function SleepStories({S,lang,isPremium,onNeedPremium}){
  const[playing,setPlaying]=useState(null);
  function toggle(st){if(playing===st.id){stopVoice();setPlaying(null);return;}if(!st.free&&!isPremium){onNeedPremium();return;}stopVoice();say(st.txt[lang],lang);setPlaying(st.id);}
  useEffect(()=>()=>stopVoice(),[]);
  return(
    <div style={{marginTop:20}}>
      <div style={{fontSize:9,letterSpacing:2,color:T.muted,textTransform:'uppercase',marginBottom:4}}>\u03a8 {S.sleepStories}</div>
      <p style={{fontSize:12,color:T.cream2,marginBottom:12,fontStyle:'italic',fontFamily:"'Cormorant Garamond',serif"}}>{S.sleepSub}</p>
      {SLEEP_STORIES.map(st=>{const locked=!st.free&&!isPremium;const isPlaying=playing===st.id;return(
        <div key={st.id} style={{display:'flex',alignItems:'center',gap:12,background:isPlaying?'rgba(200,151,58,0.07)':T.bg2,border:`1px solid ${isPlaying?T.b2:T.b1}`,borderRadius:12,padding:'12px 14px',marginBottom:8,opacity:locked?.7:1}}>
          <div style={{width:38,height:38,borderRadius:10,background:'rgba(200,151,58,0.08)',border:`1px solid ${T.b2}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,color:T.gold,flexShrink:0}}>{st.icon}</div>
          <div style={{flex:1,minWidth:0}}><div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:15,color:T.cream}}>{st.t[lang]}</div><div style={{fontSize:10,color:T.muted}}>{st.mins} \u00b7 Freud</div></div>
          {locked?(<span onClick={()=>onNeedPremium()} style={{fontSize:10,color:T.gold,border:`1px solid ${T.b2}`,padding:'4px 10px',borderRadius:14,cursor:'pointer'}}>\u2726 {S.premiumOnly}</span>):(<button onClick={()=>toggle(st)} style={{fontSize:11,color:isPlaying?T.bg:T.gold,background:isPlaying?T.gold:'transparent',border:`1px solid ${T.b2}`,padding:'5px 12px',borderRadius:14,cursor:'pointer',fontFamily:"'Jost',sans-serif",whiteSpace:'nowrap'}}>{isPlaying?S.stop:S.listen}</button>)}

    </div>
  );

function RitualsScreen({session,lang,S,sequence,setSequence,checked,setChecked,todayMood,profile,isPremium,onNeedPremium}){
  const[activeRitual,setActiveRitual]=useState(null);
  const rituals=RITUALS.filter(r=>r.session===session);
  const mySeq=sequence[session]||[];
  const seqRituals=mySeq.map(id=>rituals.find(r=>r.id===id)).filter(Boolean);
  const done=mySeq.filter(id=>checked[id]).length;
  const pct=mySeq.length?Math.round(done/mySeq.length*100):0;
  const moodIdx=todayMood?MOOD_DEFS.findIndex(m=>m.id===todayMood):-1;
  const moodObj=moodIdx>=0?MOOD_DEFS[moodIdx]:null;
  const dailyPath=useMemo(()=>buildDailyPath(profile,todayMood,session),[profile,todayMood,session]);
  function addToSeq(id){const ns={...sequence,[session]:[...(sequence[session]||[]),id]};setSequence(ns);LS.set('pg_sequence',ns);}
  function onDone(id){setChecked(c=>{const n={...c,[id]:true};LS.set('pg_checked',n);return n;});setActiveRitual(null);}
  return(
    <div style={{height:'100%',overflowY:'auto',padding:'20px 18px 100px'}}>
      <div style={{marginBottom:14}}>
        <div style={{fontSize:9,letterSpacing:3,color:T.gold,textTransform:'uppercase',marginBottom:4}}>{S.daily}</div>
        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:26,fontWeight:300}}>{session==='morning'?S.morningT:S.eveningT}</div>
        <p style={{fontSize:13,color:T.cream2,marginTop:5,lineHeight:1.6}}>{session==='morning'?S.morningSub:S.eveningSub}</p>
        {moodObj&&(<div style={{display:'inline-flex',alignItems:'center',gap:6,marginTop:10,padding:'4px 10px',background:T.bg3,border:`1px solid ${T.b1}`,borderRadius:20}}><span style={{fontSize:12,color:moodObj.color}}>{moodObj.icon}</span><span style={{fontSize:11,color:T.cream2}}>{S.moodToday} {S.moods[moodIdx].toLowerCase()}</span></div>)}
      </div>
      {session==='morning'&&<DailyQuote lang={lang} S={S}/>}
      <DailyPath S={S} lang={lang} path={dailyPath} checked={checked} onOpen={r=>setActiveRitual(r)}/>
      {mySeq.length>0&&(
        <div style={{marginBottom:16}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:7}}><span style={{fontSize:12,color:T.cream2}}>{done}/{mySeq.length} {S.completed}</span><span style={{fontSize:12,color:T.gold}}>{pct}%</span></div>
          <div style={{height:3,background:T.bg3,borderRadius:3}}><div style={{height:'100%',width:pct+'%',background:T.gold,borderRadius:3,transition:'width .4s'}}/></div>
        </div>
      )}
      {seqRituals.map(r=>(<RitualCard key={r.id} ritual={r} lang={lang} S={S} checked={!!checked[r.id]} onTap={()=>setActiveRitual(r)} canAdd={false} inSession={true} onAddTo={null}/>))}
      {rituals.filter(r=>!mySeq.includes(r.id)).length>0&&(
        <div>
          <div style={{fontSize:9,letterSpacing:2,color:T.muted,textTransform:'uppercase',marginTop:20,marginBottom:10}}>{S.otherRituals}</div>
          {rituals.filter(r=>!mySeq.includes(r.id)).map(r=>(<RitualCard key={r.id} ritual={r} lang={lang} S={S} checked={false} onTap={()=>setActiveRitual(r)} canAdd={true} inSession={false} onAddTo={()=>addToSeq(r.id)}/>))}
        </div>
      )}
      {session==='evening'&&<SleepStories S={S} lang={lang} isPremium={isPremium} onNeedPremium={onNeedPremium}/>}
      {activeRitual&&<RitualModal ritual={activeRitual} lang={lang} S={S} isPremium={isPremium} onClose={()=>setActiveRitual(null)} onDone={onDone} onNeedPremium={onNeedPremium}/>}
    </div>
  );
}
